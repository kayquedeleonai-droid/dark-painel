{% extends "base.html" %}
{% block title %}Página não encontrada · CubeForge{% endblock %}
{% block content %}
<section class="block page notfound">
  <p class="console">&gt; unknown command: <b>{{ request.path }}</b></p>
  <h1 class="page-title">Essa página não existe.</h1>
  <p class="lead">Pode ser um link antigo ou um jogador que saiu do ranking.</p>
  <p><a class="more" href="{{ url_for('index') }}">Voltar para o início</a></p>
</section>
{% endblock %}

<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262824">
<title>{% block title %}CubeForge · servidores de AssaultCube{% endblock %}</title>
<meta name="description" content="Servidores de AssaultCube com ranking por jogador, mapas e conteúdo da comunidade.">
<link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
<link rel="preload" href="{{ url_for('static', filename='fonts/teko-latin-600-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="top">
  <a class="logo" href="{{ url_for('index') }}" aria-label="CubeForge, página inicial"><span class="cube">Cube</span><span class="forge">Forge</span></a>
  <nav aria-label="Principal">
    <a href="{{ url_for('index') }}#servidores">Servidores</a>
    <a href="{{ url_for('ranking') }}">Ranking</a>
    <a href="{{ url_for('downloads') }}">Downloads</a>
    <a href="{{ url_for('index') }}#como-jogar">Como jogar</a>
    {% if site.discord %}<a href="{{ site.discord }}" rel="noopener">Discord</a>{% endif %}
  </nav>
</header>
<main id="conteudo">
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <p><span class="cube">Cube</span><span class="forge">Forge</span> é um projeto da comunidade, sem ligação com a equipe oficial do AssaultCube.
  O jogo é gratuito e de código aberto: <a href="https://assault.cubers.net/" rel="noopener">assault.cubers.net</a>.</p>
</footer>
<script src="{{ url_for('static', filename='site.js') }}" defer></script>
</body>
</html>

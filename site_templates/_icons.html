{# Ícones de HUD desenhados para o CubeForge em grade de 16x16 pixels (não são arquivos do jogo). #}
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <!-- vida: cruz -->
    <symbol id="i-health" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M6 1h4v5h5v4h-5v5H6v-5H1V6h5z"/>
      <path fill="rgba(0,0,0,.25)" d="M10 6h5v1h-5zM6 10h1v5H6z"/>
    </symbol>
    <!-- colete -->
    <symbol id="i-armor" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M3 1h3v2h4V1h3v1h2v13H1V2h2zM6 6v8h4V6z"/>
      <path fill="rgba(0,0,0,.25)" d="M2 9h3v1H2zM11 9h3v1h-3z"/>
    </symbol>
    <!-- munição: pente com balas -->
    <symbol id="i-ammo" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M2 3h2V1h1v2h2V1h1v2h2V1h1v2h2V1h1v2h1v12H1V3h1zm1 4v6h10V7z"/>
      <path fill="currentColor" d="M4 8h1v4H4zM7 8h1v4H7zM10 8h1v4h-1z"/>
    </symbol>
    <!-- tempo restante -->
    <symbol id="i-clock" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M5 1h6v1h2v2h1v2h1v4h-1v2h-1v2h-2v1H5v-1H3v-2H2v-2H1V6h1V4h1V2h2zm0 3v1H4v2H3v2h1v2h1v1h6v-1h1V9h1V7h-1V5h-1V4z"/>
      <path fill="currentColor" d="M7 5h2v3h3v2H7z"/>
    </symbol>
    <!-- jogadores: capacete -->
    <symbol id="i-players" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M5 2h6v1h2v2h1v4h1v2H1V9h1V5h1V3h2zM3 12h10v2H3z"/>
      <path fill="rgba(0,0,0,.3)" d="M4 9h8v1H4z"/>
    </symbol>
    <!-- kills: mira -->
    <symbol id="i-frag" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M7 0h2v5H7zM7 11h2v5H7zM0 7h5v2H0zM11 7h5v2h-5zM7 7h2v2H7z"/>
      <path fill="currentColor" d="M4 3h1v1H4zM3 4h1v1H3zM11 3h1v1h-1zM12 4h1v1h-1zM3 11h1v1H3zM4 12h1v1H4zM12 11h1v1h-1zM11 12h1v1h-1z"/>
    </symbol>
    <!-- mortes: caveira -->
    <symbol id="i-death" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M4 1h8v1h1v1h1v6h-1v2h-1v2H4v-2H3V9H2V3h1V2h1zm1 5v2h2V6zm4 0v2h2V6zM7 9v1h2V9zM5 14h1v1H5zM7 14h2v1H7zM10 14h1v1h-1z"/>
    </symbol>
    <!-- bandeira -->
    <symbol id="i-flag" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M2 1h2v15H2z"/>
      <path fill="currentColor" d="M4 2h4v1h3v1h3v6h-3V9H8V8H4z"/>
    </symbol>
    <!-- mapa: grade do editor -->
    <symbol id="i-map" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M1 2h14v12H1zm1 1v10h12V3z"/>
      <path fill="currentColor" d="M5 3h1v10H5zM10 3h1v10h-1zM2 6h12v1H2zM2 10h12v1H2z"/>
      <path fill="currentColor" d="M6 7h4v3H6z" opacity=".6"/>
    </symbol>
    <!-- modelo: cubo -->
    <symbol id="i-model" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M7 1h2v1h2v1h2v1h1v8h-1v1h-2v1H9v1H7v-1H5v-1H3v-1H2V4h1V3h2V2h2z"/>
      <path fill="rgba(0,0,0,.35)" d="M8 7h5v6h-2v1H9v1H8z"/>
      <path fill="rgba(255,255,255,.25)" d="M5 3h6v1h2v1H9v1H7V5H3V4h2z"/>
    </symbol>
    <!-- skin: soldado -->
    <symbol id="i-skin" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M6 1h4v1h1v3h-1v1H6V5H5V2h1zM4 7h8v1h2v5h-2v3H9v-3H7v3H4v-3H2V8h2z"/>
      <path fill="rgba(0,0,0,.3)" d="M5 3h6v1H5z"/>
    </symbol>
    <!-- medalha / skill -->
    <symbol id="i-skill" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="currentColor" d="M4 0h3v4H6v1H5V2H4zM9 0h3v2h-1v3h-1V4H9z"/>
      <path fill="currentColor" d="M6 5h4v1h2v2h1v4h-1v2h-2v1H6v-1H4v-2H3V8h1V6h2z"/>
      <path fill="rgba(0,0,0,.35)" d="M7 8h2v1h1v2H9v1H7v-1H6V9h1z"/>
    </symbol>
  </defs>
</svg>
